<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>人物细节 · v11 / v12</title>
<style>body{margin:0;background:#eee9df;font:14px system-ui;display:grid;place-items:center;min-height:100vh;color:#355448}main{width:min(1200px,96vw);margin:24px auto}canvas{display:block;width:100%;border-radius:18px}button{display:block;margin:16px auto;padding:12px 24px;border:0;border-radius:25px;background:#355e53;color:#fff;font:inherit}</style>
<main><canvas id="output" width="1800" height="1100"></canvas><button id="download" disabled>下载细节对比图</button></main>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
import { createCharacter } from './references/character-v12.js';
import { createCharacter as createPrevious } from './references/character-v11.js';
import { configureRenderer } from '../src/lighting.js';
const ctx=document.querySelector('canvas').getContext('2d');ctx.fillStyle='#f6f1e7';ctx.fillRect(0,0,1800,1100);
ctx.fillStyle='#304c3e';ctx.font='600 48px system-ui';ctx.fillText('人物细节 · v11 / v12',60,70);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf6f1e7);scene.add(new THREE.HemisphereLight(0xfff2de,0xa4b19c,2));
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,40);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});configureRenderer(renderer,false);renderer.setPixelRatio(1);renderer.setSize(600,400);renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:.1,far:20});sun.shadow.normalBias=.005;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0xf6f1e7,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
for(const [row,make,label] of [[0,createPrevious,'v11'],[1,createCharacter,'v12']]) {
  const c=make('cozy');c.update(2);scene.add(c.walker);
  for(const [col,angle,focus,half,title] of [[0,.15,1.23,.36,'眼神与面部'],[1,Math.PI,1.23,.36,'层次发束'],[2,.15,.57,.20,'手型与袖口']]) {
    c.walker.rotation.y=angle;camera.top=half;camera.bottom=-half;camera.left=-half*1.5;camera.right=half*1.5;camera.position.set(0,focus+(col===2?.8:.15),col===2?1.6:8);camera.lookAt(0,focus,0);camera.updateProjectionMatrix();renderer.render(scene,camera);
    const x=col*600,y=140+row*470;ctx.drawImage(renderer.domElement,x,y,600,400);
    ctx.fillStyle='#f6f1e7e6';ctx.fillRect(x+12,y+8,270,36);ctx.fillStyle='#35513f';ctx.font='600 26px system-ui';ctx.fillText(label+' · '+title,x+24,y+35);
  }
  scene.remove(c.walker);
}
ctx.fillStyle='#75816e';ctx.font='24px system-ui';ctx.fillText('相同光照和镜头 · 直接渲染游戏模型',60,1060);
const button=document.querySelector('button');button.disabled=false;button.onclick=()=>document.querySelector('canvas').toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='character-refined-v12-comparison.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);},'image/png');window.previewReady=true;
</script></html>
