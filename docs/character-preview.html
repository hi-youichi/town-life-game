<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>人物美化 · 实际模型对比</title>
<style>
body{margin:0;background:#eee9df;font-family:system-ui,sans-serif;color:#3c483e;display:grid;place-items:center;min-height:100vh}main{width:min(1100px,96vw)}canvas{display:block;width:100%;border-radius:20px;box-shadow:0 16px 60px #49463715}button{display:block;margin:20px auto;border:0;border-radius:30px;padding:12px 26px;background:#355e53;color:white;font:inherit;cursor:pointer}p{text-align:center;font-size:13px;color:#697365}
</style>
<main><canvas id="output" width="1600" height="1000"></canvas><button id="download" disabled>下载人物对比效果图</button><p>直接加载游戏中的 character.js，展示原版、新版正面与新版背面。</p></main>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
import { createCharacter } from '../src/character.js';
import { configureRenderer } from '../src/lighting.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf3f0e8);
const camera=new THREE.OrthographicCamera(-3.2,3.2,2.2,-1.1,.1,40);
camera.position.set(0,2.7,8);camera.lookAt(0,.83,0);
const renderer=new THREE.WebGLRenderer({antialias:true});configureRenderer(renderer,false);
renderer.setPixelRatio(1);renderer.setSize(1600,825);renderer.shadowMap.type=THREE.PCFSoftShadowMap;
scene.add(new THREE.HemisphereLight(0xfff2de,0xa4b19c,2));
const sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(-3,7,5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:.1,far:20});sun.shadow.normalBias=.015;sun.shadow.radius=4;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xf3f0e8,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const old=new THREE.Group();
const oldSkin=new THREE.MeshStandardMaterial({color:0xffc58f,roughness:.9});
const oldCoat=new THREE.MeshStandardMaterial({color:0xd76742,roughness:.85});
const oldPants=new THREE.MeshStandardMaterial({color:0x405d79,roughness:.9});
const oldEyes=new THREE.MeshStandardMaterial({color:0x302c2a,roughness:.8});
function oldPart(g,m,x,y,z){const p=new THREE.Mesh(g,m);p.position.set(x,y,z);p.castShadow=true;old.add(p);}
oldPart(new THREE.CapsuleGeometry(.22,.38,4,8),oldCoat,0,.67,0);
oldPart(new THREE.SphereGeometry(.19,12,10),oldSkin,0,1.12,0);
for(const x of [-.11,.11])oldPart(new THREE.CylinderGeometry(.07,.09,.34,8),oldPants,x,.25,0);
for(const x of [-.065,.065])oldPart(new THREE.SphereGeometry(.075,10,8),oldEyes,x,1.14,.16);
old.position.set(-2,.04,0);old.scale.setScalar(1.3);old.rotation.y=.16;scene.add(old);
const front=createCharacter(),back=createCharacter();
front.walker.position.set(0,.035,0);front.walker.scale.setScalar(1.3);front.walker.rotation.y=-.16;
back.walker.position.set(2,.035,0);back.walker.scale.setScalar(1.3);back.walker.rotation.y=Math.PI+.35;
scene.add(front.walker,back.walker);
front.update(2);back.update(2);
renderer.render(scene,camera);
const output=document.getElementById('output'),ctx=output.getContext('2d');
ctx.fillStyle='#f3f0e8';ctx.fillRect(0,0,1600,1000);ctx.drawImage(renderer.domElement,0,135);
ctx.fillStyle='#2f4b3f';ctx.font='600 48px system-ui';ctx.fillText('小镇居民 · 人物美化',76,82);
ctx.fillStyle='#758073';ctx.font='24px system-ui';ctx.fillText('保留橙色外套与小镇风格，增加更亲切的表情和完整的人物轮廓',78,127);
ctx.strokeStyle='#d7dbcc';ctx.lineWidth=2;
for(const x of [550,1050]){ctx.beginPath();ctx.moveTo(x,200);ctx.lineTo(x,885);ctx.stroke();}
ctx.textAlign='center';ctx.fillStyle='#354f41';ctx.font='600 30px system-ui';
ctx.fillText('原版',300,900);ctx.fillText('新版 · 正面',800,900);ctx.fillText('新版 · 背面',1300,900);
ctx.fillStyle='#768075';ctx.font='22px system-ui';ctx.fillText('胶囊身体 / 大黑眼球',300,942);ctx.fillText('头发 · 微笑 · 手臂 · 运动鞋',800,942);ctx.fillText('小背包 · 肩带 · 衣服层次',1300,942);
const button=document.getElementById('download');button.disabled=false;
button.onclick=()=>output.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='character-polish-comparison.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);},'image/png');
window.previewReady=true;
</script>
</html>
