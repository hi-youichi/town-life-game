<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小镇街道漫步</title>
<style>
:root { --background:#f5f5f2; --card:#eee4ce; --green:#b2ca82; --orange:#c66b48; --blue:#4c9bb4; --muted-foreground:#72533e; --destructive:#b91c1c; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; }
body { background:var(--background); font-family:system-ui,sans-serif; }
body, #three-house-demo { transition:background-color .5s, color .5s; }
body.night { background:#111a23; color:#e1e7e8; }
</style>
</head>
<body>
<div id="three-house-demo">
  <div class="three-house-view" role="application" aria-label="三维小镇。点击街道移动小人，点击房屋进屋，可拖动旋转视角、滚轮缩放"></div>
  <p class="three-house-status" aria-live="polite">小人正在路口等你。</p>
  <p class="three-house-fps" aria-label="帧率监控" title="每半秒更新平均帧率和帧间隔">FPS — · — ms</p>
  <button class="three-house-time" type="button" aria-label="切换到夜晚" title="切换昼夜">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"/></svg>
  </button>
  <button class="three-house-exit" type="button" aria-label="返回街道" title="返回街道" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4h11v16M2 20h20M10 20v-6h5M17 12h5m-3-3 3 3-3 3"/></svg>
  </button>
  <button class="three-house-photo" type="button" aria-label="下载场景截图" title="下载场景截图">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>
  <details class="three-house-character">
    <summary aria-label="选择人物"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4-5 3 3 5 2-1v9h8v-9l2 1 3-5-5-3c-1 3-7 3-8 0Z"/></svg><span>人物 · <span class="character-current">圆润治愈</span></span></summary>
    <div class="character-panel"><p>选择你的居民</p><div class="character-choices" role="group" aria-label="人物造型"></div></div>
  </details>
  <p class="three-house-toast" role="status" hidden></p>
  <p class="three-house-error" role="alert" hidden></p>
</div>
<style>
  #three-house-demo { position:relative; width:100vw; height:100vh; height:100dvh; overflow:hidden; background:var(--background); }
  #three-house-demo .three-house-view { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #three-house-demo canvas { display: block; width: 100%; height: 100%; }
  #three-house-demo .three-house-view canvas { cursor: crosshair; }
  #three-house-demo .three-house-status { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  #three-house-demo .three-house-fps { position:absolute; z-index:2; top:calc(env(safe-area-inset-top) + 12px); left:calc(env(safe-area-inset-left) + 12px); margin:0; padding:8px 12px; border:1px solid #ffffff55; border-radius:10px; background:#17232dcc; color:#fff; font:12px/1.5 ui-monospace,monospace; font-variant-numeric:tabular-nums; pointer-events:none; white-space:nowrap; }
  #three-house-demo .three-house-time, #three-house-demo .three-house-exit, #three-house-demo .three-house-photo { position:absolute; z-index:2; right:calc(env(safe-area-inset-right) + 12px); width:48px; height:48px; display:grid; place-items:center; padding:0; border:1px solid #ffffff55; border-radius:50%; background:#17232dcc; color:#fff; box-shadow:0 2px 12px #0004; cursor:pointer; touch-action:manipulation; }
  #three-house-demo .three-house-time { top:calc(env(safe-area-inset-top) + 12px); }
  #three-house-demo .three-house-exit { top:calc(env(safe-area-inset-top) + 68px); }
  #three-house-demo .three-house-photo { bottom:calc(env(safe-area-inset-bottom) + 18px); }
  #three-house-demo .three-house-error:not([hidden]) { position:absolute; z-index:4; inset:40% 20px auto; padding:16px; background:#17232de6; color:white; border-radius:12px; text-align:center; }
  #three-house-demo button[hidden] { display:none; }
  #three-house-demo button:focus-visible { outline:3px solid #ffe3a0; outline-offset:3px; }
  #three-house-demo .three-house-character { position:absolute; z-index:3; left:calc(env(safe-area-inset-left) + 12px); bottom:calc(env(safe-area-inset-bottom) + 18px); color:#fff; font-size:13px; }
  #three-house-demo .three-house-character summary { display:flex; align-items:center; gap:8px; min-height:46px; box-sizing:border-box; padding:0 14px; border:1px solid #ffffff55; border-radius:24px; background:#17232de8; box-shadow:0 2px 12px #0003; cursor:pointer; list-style:none; touch-action:manipulation; }
  #three-house-demo .three-house-character summary::-webkit-details-marker { display:none; }
  #three-house-demo .three-house-character summary:focus-visible { outline:3px solid #ffe3a0; outline-offset:3px; }
  #three-house-demo .three-house-character summary svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round; }
  #three-house-demo .character-panel { position:absolute; left:0; bottom:58px; width:244px; box-sizing:border-box; padding:14px; border:1px solid #ffffff44; border-radius:18px; background:#f7f2e8; color:#2e493f; box-shadow:0 10px 30px #0003; }
  #three-house-demo .character-panel p { margin:0 0 10px; font-weight:600; font-size:14px; }
  #three-house-demo .character-choices { display:grid; gap:6px; }
  #three-house-demo .character-choices button { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid transparent; border-radius:12px; background:transparent; color:inherit; text-align:left; cursor:pointer; font:inherit; }
  #three-house-demo .character-choices button:hover { background:#ebe5d9; }
  #three-house-demo .character-choices button[aria-pressed="true"] { background:#e1eadd; border-color:#8fa88c; }
  #three-house-demo .character-swatch { display:grid; place-items:center; width:34px; height:38px; border-radius:11px; color:#243c34; font-size:15px; font-weight:700; flex:none; }
  #three-house-demo .character-choices strong, #three-house-demo .character-choices small { display:block; }
  #three-house-demo .character-choices small { font-size:11px; margin-top:3px; color:#647367; }
  #three-house-demo.night .character-panel { background:#23332e; color:#edf0e5; }
  #three-house-demo.night .character-choices button:hover { background:#32453b; }
  #three-house-demo.night .character-choices button[aria-pressed="true"] { background:#3b5545; border-color:#9fbc9a; }
  #three-house-demo.night .character-choices small { color:#bfd0c0; }
  #three-house-demo button:disabled { opacity:.55; cursor:wait; }
  #three-house-demo .three-house-toast { position:absolute; z-index:3; bottom:calc(env(safe-area-inset-bottom) + 78px); left:50%; transform:translateX(-50%); margin:0; padding:10px 16px; border-radius:14px; background:#17232de6; color:#fff; font-size:14px; max-width:80%; text-align:center; }
  #three-house-demo button svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #three-house-demo.night { --background:#17232d; --card:#515966; --green:#4d7656; --orange:#a85c41; --blue:#65a8ba; --muted-foreground:#46515f; --foreground:#607080; color:#e4ecee; }
</style>
<script type="module" src="./src/main.js"></script>
</body></html>
